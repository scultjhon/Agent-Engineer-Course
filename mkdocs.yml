site_name: Agent Engineer Course
site_description: A practical, open learning path for enterprise agent engineering
site_url: https://scultjhon.github.io/Agent-Engineer-Course/
repo_url: https://github.com/scultjhon/Agent-Engineer-Course
repo_name: scultjhon/Agent-Engineer-Course

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Fundamentals:
      - Lesson 01 — Agent Loop: fundamentals/01-agent-loop.md
      - Lesson 02 — Git and Agents: fundamentals/02-git-agent.md
      - Lesson 03 — Staging, Merge, Conflict: fundamentals/03-git-staging-merge.md
      - Lesson 04 — Shell and Runtime: fundamentals/04-shell-runtime.md
      - Lesson 05 — Processes and Signals: fundamentals/05-process-signal.md
      - Lesson 06 — Permissions and Sandboxes: fundamentals/06-permissions-sandbox.md
      - Lesson 07 — Docker and Agents: fundamentals/07-docker-agent.md
      - Lesson 08 — Compose: fundamentals/08-compose.md
      - Lesson 09 — HTTP, SSE, WebSocket: fundamentals/09-networking.md
      - Lesson 10 — Nginx, DNS, TLS: fundamentals/10-nginx-dns-tls.md
      - Lesson 11 — Kubernetes Jobs: fundamentals/11-kubernetes-job.md
  - Source study:
      - Overview: source-code/index.md
      - Codex: source-code/codex.md
      - OpenCode: source-code/opencode.md
      - Kimi Code: source-code/kimi-code.md
      - Claude Code public mechanisms: source-code/claude-code.md
  - Model engineering:
      - Overview: model-engineering/index.md
      - Hugging Face: model-engineering/hugging-face.md
  - Labs: labs/index.md
  - Contributing: contributing.md
  - Disclaimer: disclaimer.md
